<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c10"/>
      <stop offset="100%" style="stop-color:#13131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="#1e1e2a" stroke-width="18"/>
  <!-- Progress arc -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#accent)" stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="653"
    stroke-dashoffset="163"
    transform="rotate(-90 256 220)"/>
  <!-- Checkmark icon -->
  <path d="M200 220 L240 260 L320 175" stroke="url(#accent)" stroke-width="24"
    stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arabic text م ح (مهامي) -->
  <text x="256" y="410" text-anchor="middle"
    font-family="'IBM Plex Sans Arabic', Arial, sans-serif"
    font-size="64" font-weight="700" fill="url(#accent)">مهامي</text>
</svg>
