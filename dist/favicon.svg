<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Orange-red gradient background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  
  <!-- Kaaba body - dark cube -->
  <rect x="156" y="140" width="200" height="200" rx="8" fill="#1a1a1a" stroke="#000" stroke-width="3"/>
  
  <!-- Kiswa gold band -->
  <rect x="156" y="210" width="200" height="40" fill="none" stroke="#d4a017" stroke-width="2.5"/>
  <rect x="156" y="215" width="200" height="4" fill="#d4a017" opacity="0.6"/>
  <rect x="156" y="242" width="200" height="4" fill="#d4a017" opacity="0.6"/>
  
  <!-- Door -->
  <rect x="228" y="250" width="56" height="80" rx="4" fill="#292929" stroke="#d4a017" stroke-width="2.5"/>
  <path d="M231 272 Q256 248 281 272" fill="none" stroke="#d4a017" stroke-width="2"/>
  
  <!-- Hajr Ismail -->
  <path d="M156 340 Q90 295 90 230 Q90 165 156 140" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
  
  <!-- Black stone corner marker -->
  <circle cx="366" cy="340" r="7" fill="#d4a017"/>
  
  <!-- LOC text -->
  <text x="256" y="430" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="64" font-weight="800" fill="#fff" letter-spacing="8">LOC</text>
</svg>
